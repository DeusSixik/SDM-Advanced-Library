tasks.register('jmhCleanup', JavaExec) {
    group = 'verification'
    description = 'Compare frozen and current ECS implementations with identical workloads and GC profiling.'
    dependsOn tasks.named('jmhClasses'), tasks.named('jmhBaselineClasses')
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(requiredJava) }
    def methodPattern = providers.gradleProperty('jmhMethod').getOrElse('(before|after)')
    def reportName = providers.gradleProperty('jmhReport').getOrElse('ecs-cleanup')
    def vmOptions = '-Xms512m -Xmx512m -XX:+UseG1GC'
    if (providers.gradleProperty('jmhJfr').isPresent()) {
        vmOptions += ' -XX:StartFlightRecording=filename=build/reports/jmh/ecs-allocation-profile.jfr,settings=profile,dumponexit=true'
    }
    args "dev.sixik.sdmal.benchmark.EcsCleanupBenchmark.${methodPattern}", '-prof', 'gc', '-foe', 'true',
        '-jvmArgsAppend', vmOptions, '-rf', 'json',
        '-rff', layout.buildDirectory.file("reports/jmh/${reportName}.json").get().asFile.absolutePath
    if (providers.gradleProperty('jmhCases').isPresent()) {
        args '-p', "workload=${providers.gradleProperty('jmhCases').get()}"
    }
    if (providers.gradleProperty('jmhForks').isPresent()) {
        args '-f', providers.gradleProperty('jmhForks').get()
    }
    doFirst {
        if (stonecutter.current.version != '1.20.1') {
            throw new GradleException('The frozen cleanup baseline uses Minecraft 1.20.1; run :core:1.20.1:jmhCleanup.')
        }
        layout.buildDirectory.dir('reports/jmh').get().asFile.mkdirs()
    }
}

tasks.register('jmhCollections', JavaExec) {
    group = 'verification'
    description = 'Compare the exact pre-fastutil ECS snapshot with current collections, using GC profiling.'
    dependsOn tasks.named('jmhClasses'), tasks.named('jmhCollectionsBaselineClasses')
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(requiredJava) }
    args 'dev.sixik.sdmal.benchmark.EcsCleanupBenchmark.(before|after)', '-p', 'baseline=collections',
        '-p', 'workload=owner:128:0,queries:1024:0,delta:128:0',
        '-prof', 'gc', '-foe', 'true', '-jvmArgsAppend', '-Xms512m -Xmx512m -XX:+UseG1GC',
        '-rf', 'json', '-rff', layout.buildDirectory.file('reports/jmh/ecs-collections.json').get().asFile.absolutePath
    doFirst {
        if (stonecutter.current.version != '1.20.1') throw new GradleException('The collections baseline targets Minecraft 1.20.1.')
        layout.buildDirectory.dir('reports/jmh').get().asFile.mkdirs()
    }
}
