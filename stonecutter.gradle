stonecutter.active '1.20.1'

allprojects {
    buildscript.repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

stonecutter.parameters {
    def loader = branch.getId()
    constants { match(loader, 'fabric', 'forge', 'neoforge') }
    constants['modern_neo'] = loader == 'neoforge' && current.version != '1.20.1'
    replacements {
        string(current.parsed.matches('>=1.21.11')) { replace('ResourceLocation', 'Identifier') }
        string(loader == 'fabric' && current.parsed.matches('>=26.1')) {
            replace('net.fabricmc.fabric.api.itemgroup', 'net.fabricmc.fabric.api.creativetab')
            replace('FabricItemGroup', 'FabricCreativeModeTab')
            replace('ItemGroupEvents', 'CreativeModeTabEvents')
            replace('modifyEntriesEvent', 'modifyOutputEvent')
        }
        string(loader == 'neoforge' && current.version != '1.20.1') {
            replace('net.minecraftforge.fml', 'net.neoforged.fml')
            replace('net.minecraftforge.eventbus', 'net.neoforged.bus')
            replace('net.minecraftforge.api', 'net.neoforged.api')
            replace('net.minecraftforge.common', 'net.neoforged.neoforge.common')
            replace('net.minecraftforge.event', 'net.neoforged.neoforge.event')
            replace('net.minecraftforge.registries', 'net.neoforged.neoforge.registries')
            replace('ForgeConfigSpec', 'ModConfigSpec')
        }
    }
}
tasks.register('buildAll') {
    group = 'build'
    description = 'Build and test every supported Minecraft/loader combination.'
    dependsOn stonecutter.tasks.names('buildAndCollect') { it.branch.getId() in ['fabric', 'forge', 'neoforge'] }
}
['Fabric': 'fabric', 'Forge': 'forge', 'NeoForge': 'neoforge'].each { label, loader ->
    tasks.register("build${label}") {
        group = 'build'
        description = "Build and test every ${loader} variant."
        dependsOn stonecutter.tasks.names('buildAndCollect') { it.branch.getId() == loader }
    }
}
