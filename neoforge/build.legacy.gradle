import dev.kikugie.stonecutter.controller.task.StonecutterTaskMutexService

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'java-library'
}
apply from: rootProject.file('build.gradle')
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.7:processor' }
legacyForge {
    // NeoForge 1.20.1 still uses Forge packages and the mods.toml descriptor.
    enable { neoForgeVersion = "1.20.1-${loader_version}" }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
}
tasks.named('createMinecraftArtifacts') {
    dependsOn 'stonecutterGenerate'
    usesService(StonecutterTaskMutexService.create(gradle, 'minecraftArtifacts'))
}
def legacyRefmap = mixin.add(sourceSets.main, "${mod_id}.refmap.json")
mixin.config "${mod_id}.core.mixins.json"
mixin.config "${mod_id}.impl.mixins.json"
tasks.named('compileJava', JavaCompile) {
    // Mixin's processor does not run once the last mixin has been removed.
    // Reset its outputs so an incremental build cannot package old references or member mappings.
    doFirst {
        def reference = legacyRefmap.get().asFile
        reference.parentFile.mkdirs()
        reference.text = '{"mappings": {}, "data": {}}'
        layout.buildDirectory.file("mixin/${mod_id}.refmap.json.mappings.tsrg").get().asFile.text = ''
    }
}
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': "${mod_id}.core.mixins.json,${mod_id}.impl.mixins.json")
}
tasks.register('buildAndCollect', Copy) {
    group = 'build'
    dependsOn tasks.named('build')
    from tasks.named('reobfJar'), tasks.named('sourcesJar')
    into rootProject.layout.buildDirectory.dir("libs/${mod_version}")
}
